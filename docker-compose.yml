#
# docker-compose.yml — pip-install Hermes Docker stack
#
# Uses the slim Dockerfile in this branch (pip install + sparse-clone skills).
# Builds in ~30 seconds, image is ~500 MB.  See the Dockerfile docstring for
# what's included vs the upstream full-build image.
#
# Usage:
#   HERMES_UID=$(id -u) HERMES_GID=$(id -g) docker compose up --build -d
#
# Security notes:
#   - Dashboard binds 0.0.0.0 inside the container; the `ports:` rule below
#     restricts external reach to 127.0.0.1 on the host so it's not LAN-exposed.
#     --insecure is the flag the dashboard requires to acknowledge the 0.0.0.0
#     bind (it stores API keys; the flag is its safety opt-in).
#   - The OpenAI-compatible HTTP API on :8642 requires API_SERVER_KEY (Bearer
#     auth).  install-docker.sh generates a strong random key into .env.
#
services:
  gateway:
    build: .
    image: hermes-agent-pip
    container_name: hermes
    restart: unless-stopped
    # Bridge networking + 127.0.0.1 port publish.  network_mode: host is
    # Linux-only and broken on Docker Desktop (Mac/Windows).
    ports:
      - "127.0.0.1:8642:8642"   # OpenAI-compatible gateway API
    volumes:
      - ~/.hermes:/opt/data
    environment:
      - HERMES_UID=${HERMES_UID:-10000}
      - HERMES_GID=${HERMES_GID:-10000}
      # OpenAI-compatible HTTP API on.  Container binds 0.0.0.0 internally;
      # host publish rule clamps external reach to 127.0.0.1:8642.  Key
      # comes from the .env file alongside this docker-compose.yml.
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_KEY=${API_SERVER_KEY}
      # Uncomment to expose MCP over streamable HTTP on :8000 (then also
      # uncomment the 8000 port mapping above).  Without this var set, the
      # entrypoint doesn't start the MCP-HTTP side-process.
      # - HERMES_MCP_HTTP_PORT=8000
    command: ["gateway", "run"]

  dashboard:
    image: hermes-agent-pip
    container_name: hermes-dashboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:9119:9119"
    depends_on:
      - gateway
    volumes:
      - ~/.hermes:/opt/data
    environment:
      - HERMES_UID=${HERMES_UID:-10000}
      - HERMES_GID=${HERMES_GID:-10000}
    command: ["dashboard", "--host", "0.0.0.0", "--no-open", "--insecure"]
